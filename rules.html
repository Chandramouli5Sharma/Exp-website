<script>
  const sidebar  = document.getElementById('sidebar');
  const backdrop = document.getElementById('sidebar-backdrop');
  const toggle   = document.getElementById('sidebar-toggle');
  const iOpen    = document.getElementById('icon-open');
  const iClose   = document.getElementById('icon-close');
  function openSidebar()  { sidebar.style.transform='translateX(0)';backdrop.style.opacity='1';backdrop.style.pointerEvents='auto';iOpen.style.display='none';iClose.style.display='block';document.body.classList.add('sidebar-open'); }
  function closeSidebar() { sidebar.style.transform='translateX(-100%)';backdrop.style.opacity='0';backdrop.style.pointerEvents='none';iOpen.style.display='block';iClose.style.display='none';document.body.classList.remove('sidebar-open'); }
  toggle.addEventListener('click', () => sidebar.style.transform==='translateX(0px)' ? closeSidebar() : openSidebar());
  backdrop.addEventListener('click', closeSidebar);
  // Hide back button on home page
  const backBtn = document.getElementById('back-btn');
  if (backBtn && (window.location.pathname.endsWith('index.html') || window.location.pathname==='/' || window.location.pathname.endsWith('/'))) {
    backBtn.style.visibility = 'hidden';
  }
</script>
